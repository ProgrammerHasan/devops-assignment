apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-assignment-deployment
  namespace: production
  labels:
    app: devops-assignment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-assignment
  template:
    metadata:
      labels:
        app: devops-assignment
    spec:
      containers:
        - name: devops-assignment-container
          image: programmerhasan/devops-assignment:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
